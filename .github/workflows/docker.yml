name: Docker image

# Builds the image and runs the unit tests in it when the image or the dependencies change;
# publishes it on ghcr.io for version tags (v*) or when started by hand. See docs/docker.md.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: [Dockerfile, .dockerignore, compose.yaml, pyproject.toml, .github/workflows/docker.yml]
  pull_request:
    paths: [Dockerfile, .dockerignore, compose.yaml, pyproject.toml, .github/workflows/docker.yml]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the image on ghcr.io"
        type: boolean
        default: false

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: monalisa-python:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Unit tests in the image
        run: docker run --rm monalisa-python:test xvfb-run -a pytest tests/unit -q
      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - name: Log in to ghcr.io
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
