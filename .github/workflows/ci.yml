name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      parity:
        description: "Record MATLAB golden calls (static2d) and replay them"
        type: boolean
        default: false

jobs:
  test:
    name: Lint and unit tests (no MATLAB)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      # System libraries of Qt and Mesa's OpenGL (napari, dialogs) and a virtual display, as in
      # the Dockerfile; checked on Ubuntu 24.04 and 26.04.
      - name: Qt system libraries
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            xvfb xauth libgl1 libegl1 libegl-mesa0 libopengl0 libglx-mesa0 libgl1-mesa-dri \
            libglib2.0-0t64 libfontconfig1 libfreetype6 libdbus-1-3 \
            libx11-6 libx11-xcb1 libxext6 libxrender1 libxi6 libxkbcommon0 libxkbcommon-x11-0 \
            libxcb1 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-shm0 libxcb-sync1 libxcb-xfixes0 \
            libxcb-xinerama0 libxcb-xinput0 libxcb-xkb1
      - run: pip install -e ".[dev]" scikit-image h5py
      - run: ruff check src tests examples tools demo
      - run: xvfb-run -a pytest tests/unit -q

  parity:
    name: MATLAB parity (static2d)
    if: github.event_name == 'workflow_dispatch' && inputs.parity
    runs-on: ubuntu-latest
    env:
      UPSTREAM_COMMIT: 0cb5cf93c699870bcd93a00b2e2cd787bef73fcc
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: MattechLab/monalisa
          ref: ${{ env.UPSTREAM_COMMIT }}
          path: upstream
      - uses: matlab-actions/setup-matlab@v2
        with:
          products: Image_Processing_Toolbox Statistics_and_Machine_Learning_Toolbox
      - name: Compile upstream MEX files
        uses: matlab-actions/run-command@v2
        with:
          command: addpath(genpath('upstream/src')); compile_mex_for_monalisa
      - name: Record golden calls
        uses: matlab-actions/run-command@v2
        with:
          command: addpath('tools/matlab_capture'); run_capture('static2d', fullfile(pwd,'fixtures','matlab'), fullfile(pwd,'upstream'), 'maxBytes', 20e6)
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]" scikit-image h5py
      - run: pytest tests/parity -q -n auto
