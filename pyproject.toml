[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "monalisa-python"
version = "0.1.0"
description = "Python port of Monalisa, the MattechLab toolbox for non-Cartesian and Cartesian MRI reconstruction"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "MattechLab" }]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "numba>=0.59",
    "h5py>=3.9",  # MATLAB v7.3 files (mitosius, witness, results)
    "matplotlib>=3.7",
    "napari[all]>=0.5",  # show_image viewer and Qt for the interactive dialogs (autoFlag=false)
    "ipywidgets>=8",  # show_image in Jupyter notebooks
]

[project.optional-dependencies]
io = ["twixtools", "ismrmrd"]  # raw data: Siemens twix, ISMRMRD
reg = ["SimpleITK>=2.3"]  # demons registration (replaces MATLAB imregdemons)
test = ["pytest>=8", "pytest-xdist", "pytest-qt"]
notebook = ["jupyterlab"]  # examples/tutorial_1/tutorial_1.ipynb
dev = ["monalisa-python[test,reg]", "ruff"]

[project.urls]
Homepage = "https://github.com/MattechLab/monalisa-python"
Upstream = "https://github.com/MattechLab/monalisa"

[tool.hatch.build.targets.wheel]
packages = ["src/monalisa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "parity: replay of MATLAB golden calls",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "NPY"]
ignore = ["E741", "N802", "N803", "N806"]
